# Netlify only builds previews of pull requests here; it is not where customers
# get the app. Production is the Cloudflare Pages project, deployed by
# .github/workflows/deploy.yml (see "The licence server" in CLAUDE.md).
#
# Netlify has no licence keys, so a plain `npm run build` refuses
# (checkLicenceConfig in vite.config.js) and every PR showed a failed deploy.
# Previews are built as test builds instead. Such a build opens on the
# activation screen and cannot be activated - the licence server only answers
# the live origin - so a preview is a check that the PR builds, not a way in.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  ALLOW_TEST_BUILD = "1"

[context.branch-deploy.environment]
  ALLOW_TEST_BUILD = "1"
